experiment:
  run_name: cnn_baseline
output_dir: outputs

data:
  data_dir: face_images
  train_dir:
  val_dir:
  test_dir:
  image_size: 48
  grayscale_to_rgb: false
  num_workers: 2
  pin_memory: true
  class_names: [angry, disgust, fear, happy, sad, surprise, neutral]
  augmentation:
    horizontal_flip_p: 0.5
    rotation_degrees: 10
    affine_translate: [0.05, 0.05]
    affine_scale: [0.95, 1.05]
    affine_shear: 5
    brightness: 0.2
    contrast: 0.2
    saturation: 0.0
    random_erasing_p: 0.25
    random_erasing_scale: [0.02, 0.12]
    random_erasing_ratio: [0.3, 3.3]

model:
  name: cnn_baseline
  num_classes: 7
  dropout: 0.4

loss:
  loss_type: cross_entropy
  label_smoothing: 0.0
  use_class_weight: false
  use_weighted_sampler: false

train:
  seed: 42
  epochs: 50
  batch_size: 128
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  scheduler: cosine
